name: Update Range File

on:
  workflow_dispatch:
  schedule:
    - cron: "05 3 * * 3"

jobs:
  update-rangemessage:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Download RangeMessage.xml
        run: |
          set -euo pipefail
          url="https://www.isbn-international.org/export_rangemessage.xml"
          tmp="RangeMessage.xml.tmp"
          rm -f "$tmp"
          response=$(curl --silent --show-error --location --proto-redir =https \
            --write-out '%{http_code} %{url_effective}' --output "$tmp" "$url")
          status=${response%% *}
          final_url=${response#* }
          case "$final_url" in
            "https://isbn-international.org/"*|"https://www.isbn-international.org/"*) ;;
            *)
              echo "Refusing download from untrusted redirect target: $final_url" >&2
              exit 1
              ;;
          esac
          if [ "$status" != "200" ]; then
            echo "Download returned HTTP $status, expected 200" >&2
            exit 1
          fi
          python3 - "$tmp" <<'PY'
          import sys
          from pathlib import Path

          from isbn_normalise import load_groups

          groups = load_groups(Path(sys.argv[1]))
          if not groups:
              raise SystemExit("RangeMessage.xml holds no usable ISBN registration groups")
          print(f"Validated {len(groups)} registration groups")
          PY
          mv "$tmp" RangeMessage.xml

      - name: Commit and push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add RangeMessage.xml
          commit_title="chore(deps): update RangeMessage.xml"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
              commit_body="triggered manually by @${GITHUB_ACTOR}."
          else
              commit_body="automated by GitHub Actions."
          fi
            if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
              commit_trailers="Co-authored-by: ${GITHUB_ACTOR} <${GITHUB_ACTOR}@users.noreply.github.com>"
            else
              commit_trailers=""
            fi
          full_msg=$(printf "%s\n\n%s\n\n%b" "$commit_title" "$commit_body" "$commit_trailers")
          git commit -m "$full_msg" || echo "No changes to commit"
          git push
