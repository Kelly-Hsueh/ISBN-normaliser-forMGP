name: Update Range File

on:
  workflow_dispatch:
  schedule:
    - cron: "05 3 * * 3"

jobs:
  update-rangemessage:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Download RangeMessage.xml
        run: |
          curl -o RangeMessage.xml https://www.isbn-international.org/export_rangemessage.xml

      - name: Commit and push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add RangeMessage.xml
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            trigger="triggered manually by @${GITHUB_ACTOR}"
          else
            trigger="automated by GitHub Actions"
          fi
          msg=$(printf "chore(deps): update RangeMessage.xml\n\n%s" "$trigger")
          git commit -s -m "$msg" || echo "No changes to commit"
          git push
