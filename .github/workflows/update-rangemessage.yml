name: Update Range File

on:
  workflow_dispatch:
  schedule:
    - cron: '05 3 * * 3'

jobs:
  update-rangemessage:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6.0.2
      
      - name: Download RangeMessage.xml
        run: |
          curl -o RangeMessage.xml https://www.isbn-international.org/export_rangemessage.xml
      
      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add RangeMessage.xml
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            msg=$(cat <<EOF
chore(deps): update RangeMessage.xml

- triggered manually by @${GITHUB_ACTOR}
EOF
)
          else
            msg=$(cat <<EOF
chore(deps): update RangeMessage.xml

- automated by GitHub Actions (scheduled)
EOF
)
          fi
          git commit -m "$msg" || echo "No changes to commit"
          git push
