name: ISBN Normaliser Bot
permissions:
  contents: read
  actions: read

concurrency:
  # The fallback firing must not overlap the primary run.
  group: isbn-normaliser-bot
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      query:
        description: "Page fetch strategy (empty = use DEFAULT_QUERY from .env)"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - transcludedin
          - booksource-search
      dry_run:
        description: "Run in dry-run mode (no edits will be saved)?"
        required: false
        default: false
        type: boolean
      max_edits:
        description: "Maximum number of edits to perform (optional, leave empty for unlimited)"
        required: false
        default: ""
  schedule:
    # The two-monthly run rides on a single best-effort GitHub scheduled firing.
    # GitHub drops a queued run when its queue is under load, and one missed
    # firing skips a whole two-month cycle, so a second firing later the same day
    # is a fallback. The fallback skips the bot run when a scheduled run already
    # succeeded within the previous 12 hours, so a normal cycle scans the pages once.
    - cron: "15 20 1 */2 *"
    - cron: "45 23 1 */2 *"

jobs:
  normalise-isbn:
    runs-on: ubuntu-latest
    steps:
      - name: Skip when this cycle already ran on schedule
        id: cycle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          # Any doubt falls back to running the bot, so a failed read never skips a cycle.
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          now=$(date -u +%s)
          if [ -z "$now" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A run within the last 12 hours is this cycle's earlier firing, including one
          # that slipped past midnight. A later cycle is two months away, so no false match.
          runs=$(gh run list --repo "${{ github.repository }}" --workflow isbn-normaliser-bot.yml --event schedule \
            --limit 20 --json databaseId,conclusion,createdAt 2>/dev/null) || runs='[]'
          earlier=$(printf '%s' "$runs" | jq --argjson now "$now" --argjson self "${{ github.run_id }}" \
            --argjson window 43200 \
            '[.[] | select(.databaseId != $self and .conclusion == "success")
                  | ($now - (.createdAt | fromdateiso8601)) as $age
                  | select($age < $window and $age > -3600)] | length' 2>/dev/null) || earlier=0
          case "$earlier" in
            '' | *[!0-9]*) earlier=0 ;;
          esac
          if [ "$earlier" -gt 0 ]; then
            echo "A scheduled run already succeeded within the last 12 hours, so this firing skips the bot run."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6.0.2
        if: steps.cycle.outputs.skip != 'true'

      - name: Set up Python
        if: steps.cycle.outputs.skip != 'true'
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.cycle.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ISBN Normaliser Bot
        if: steps.cycle.outputs.skip != 'true'
        env:
          BOT_USERNAME: ${{ secrets.BOT_USERNAME }}
          BOT_PASSWORD: ${{ secrets.BOT_PASSWORD }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.query }}" ]; then
            ARGS="$ARGS --query ${{ github.event.inputs.query }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "${{ github.event.inputs.max_edits }}" ]; then
            ARGS="$ARGS --max-edits ${{ github.event.inputs.max_edits }}"
          fi
          python mw_isbn_bot.py $ARGS
