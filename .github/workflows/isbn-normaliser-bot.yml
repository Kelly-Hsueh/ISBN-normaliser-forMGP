name: ISBN Normaliser Bot

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run mode (no edits will be saved)?'
        required: false
        default: false
        type: boolean
      max_edits:
        description: 'Maximum number of edits to perform (optional, leave empty for unlimited)'
        required: false
        default: ''
  # schedule:
  #   - cron: '15 20 * * *'

jobs:
  normalise-isbn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ISBN Normaliser Bot
        env:
          BOT_USERNAME: ${{ secrets.BOT_USERNAME }}
          BOT_PASSWORD: ${{ secrets.BOT_PASSWORD }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "${{ github.event.inputs.max_edits }}" ]; then
            ARGS="$ARGS --max-edits ${{ github.event.inputs.max_edits }}"
          fi
          python mw_isbn_bot.py $ARGS
